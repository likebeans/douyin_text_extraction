[project]
name = "douyin-text-extractor"
version = "0.3.0"
description = "抖音视频文本提取工具 - 快速将抖音视频转为文字，支持云端/本地双模式 ASR，内置 OSS 兜底方案"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "dashscope>=1.14.0",
    "ffmpeg-python>=0.2.0",
    "tqdm>=4.66.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "oss2>=2.18.0",
    "openai-whisper>=20250625",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
douyin-extract = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["src", "config.py", "main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
