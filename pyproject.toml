[project]
name = "douyin-text-extractor"
version = "1.0.0"
description = "抖音视频文本提取工具，提供 CLI 与 Web API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "dashscope>=1.14.0",
    "tqdm>=4.66.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "oss2>=2.18.0",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
local = ["openai-whisper>=20250625"]
# Native libraries are separate wheels; pin the matching pair explicitly for uv.
local-chinese = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "numpy>=1.24,<3"]

[project.scripts]
douyin-extract = "main:main"
douyin-web = "run_web:main"

[project.urls]
Homepage = "https://github.com/likebeans/douyin_text_extraction"
Repository = "https://github.com/likebeans/douyin_text_extraction"
Issues = "https://github.com/likebeans/douyin_text_extraction/issues"
Changelog = "https://github.com/likebeans/douyin_text_extraction/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
only-include = ["src", "config.py", "main.py", "web_app.py", "run_web.py", "templates", "static"]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
