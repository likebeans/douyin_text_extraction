<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}抖音视频文本提取工具{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <div class="container">
        <header class="header">
            <a class="brand" href="{{ url_for('index') }}" aria-label="抖音视频文本提取工具首页">
                <span class="brand-mark" aria-hidden="true">文</span>
                <span class="brand-copy">
                    <strong>视频文本提取</strong>
                    <small>抖音语音转写工具</small>
                </span>
            </a>
            <nav class="nav" aria-label="主导航">
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>开始提取</a>
                <a href="{{ url_for('config_page') }}" {% if request.endpoint == 'config_page' %}aria-current="page"{% endif %}>配置</a>
            </nav>
            <details id="accessSettings" class="access-settings">
                <summary>访问令牌 <span class="optional-label">可选</span></summary>
                <form id="apiTokenForm" class="api-token-form" autocomplete="off">
                    <label for="apiTokenInput">API 令牌</label>
                    <input id="apiTokenInput" type="password" autocomplete="off" aria-describedby="apiTokenHelp" placeholder="粘贴 WEB_API_TOKEN">
                    <button type="submit" class="btn btn-secondary btn-compact">应用</button>
                    <small id="apiTokenHelp" class="form-hint">本机访问通常无需填写。令牌仅保存在当前页面内存中。</small>
                    <span id="apiTokenStatus" class="form-hint" role="status" aria-live="polite"></span>
                </form>
            </details>
        </header>

        <main class="main" id="mainContent" tabindex="-1">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <p>把视频语音留成文字 · 自动转写结果请对照原视频校对</p>
        </footer>
    </div>

    <script>
    (function () {
        let apiToken = '';
        const tokenForm = document.getElementById('apiTokenForm');
        const tokenInput = document.getElementById('apiTokenInput');

        window.apiFetch = async function (url, options = {}) {
            const headers = new Headers(options.headers || {});
            if (apiToken) headers.set('X-API-Token', apiToken);
            const response = await fetch(url, { ...options, headers });
            let data;
            try {
                data = await response.json();
            } catch (_) {
                data = { success: false, error: '服务器返回了无效响应' };
            }
            if (!response.ok || data.success === false) {
                if (response.status === 401) document.getElementById('accessSettings').open = true;
                const error = new Error(data.error || `请求失败（${response.status}）`);
                error.status = response.status;
                throw error;
            }
            return data;
        };

        tokenForm.addEventListener('submit', function (event) {
            event.preventDefault();
            apiToken = tokenInput.value.trim();
            tokenInput.value = '';
            tokenForm.dispatchEvent(new CustomEvent('api-token-changed', { bubbles: true }));
            const status = document.getElementById('apiTokenStatus');
            if (status) status.textContent = apiToken ? '令牌已应用，可继续操作。' : '已清除令牌，仅限本机访问。';
            tokenForm.dispatchEvent(new Event('api-token-updated'));
        });
    }());
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
