{% extends "base.html" %}

{% block title %}首页 - 抖音视频文本提取工具{% endblock %}

{% block content %}
<div class="content-wrapper">
    <div class="card">
        <h2>📝 提取视频文本</h2>
        <p class="subtitle">输入抖音视频链接或分享口令，快速提取视频中的文本内容</p>
        
        <form id="extractForm" class="form">
            <div class="form-group">
                <label for="link">抖音链接：</label>
                <textarea 
                    id="link" 
                    name="link" 
                    rows="3" 
                    placeholder="请输入抖音视频链接或分享口令，例如：&#10;https://v.douyin.com/iRNBho6U/&#10;或完整的分享文本"
                    required></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span class="btn-text">开始提取</span>
                <span class="btn-loading" style="display: none;">处理中...</span>
            </button>
        </form>
    </div>
    
    <!-- 结果显示区域 -->
    <div id="resultArea" class="result-area" style="display: none;">
        <div class="card">
            <h2>📹 视频信息</h2>
            <div id="metadata" class="metadata"></div>
        </div>
        
        <div class="card">
            <h2>📝 提取文本</h2>
            <div id="textContent" class="text-content"></div>
        </div>
    </div>
    
    <!-- 错误提示 -->
    <div id="errorArea" class="error-area" style="display: none;">
        <div class="card card-error">
            <h2>❌ 错误</h2>
            <p id="errorMessage"></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('extractForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const link = document.getElementById('link').value.trim();
    if (!link) {
        showError('请输入抖音链接');
        return;
    }
    
    // 显示加载状态
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const btnLoading = submitBtn.querySelector('.btn-loading');
    submitBtn.disabled = true;
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline';
    
    // 隐藏之前的错误和结果
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('errorArea').style.display = 'none';
    
    try {
        const response = await fetch('/api/extract', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ link: link })
        });
        
        const data = await response.json();
        
        if (data.success) {
            // 显示结果
            displayResult(data);
        } else {
            showError(data.error || '提取失败');
        }
    } catch (error) {
        showError('网络错误: ' + error.message);
    } finally {
        // 恢复按钮状态
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
    }
});

function displayResult(data) {
    const { metadata, text } = data;
    
    // 显示元数据
    const metadataHtml = `
        <div class="metadata-item">
            <strong>标题：</strong>${escapeHtml(metadata.title)}
        </div>
        <div class="metadata-item">
            <strong>作者：</strong>${escapeHtml(metadata.author)}
        </div>
        <div class="metadata-item">
            <strong>时长：</strong>${formatDuration(metadata.duration)}秒
        </div>
        <div class="metadata-item">
            <strong>视频ID：</strong>${escapeHtml(metadata.video_id)}
        </div>
        <div class="metadata-item">
            <strong>视频链接：</strong>
            <a href="${escapeHtml(metadata.douyin_url)}" target="_blank">${escapeHtml(metadata.douyin_url)}</a>
        </div>
    `;
    document.getElementById('metadata').innerHTML = metadataHtml;
    
    // 显示文本（保留换行）
    const textHtml = text.split('\n').map(line => {
        return line.trim() ? `<p>${escapeHtml(line)}</p>` : '<br>';
    }).join('');
    document.getElementById('textContent').innerHTML = textHtml || '<p class="text-muted">未识别到文本内容</p>';
    
    // 显示结果区域
    document.getElementById('resultArea').style.display = 'block';
    
    // 滚动到结果区域
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showError(message) {
    document.getElementById('errorMessage').textContent = message;
    document.getElementById('errorArea').style.display = 'block';
    document.getElementById('errorArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    if (mins > 0) {
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    return secs.toString();
}
</script>
{% endblock %}
