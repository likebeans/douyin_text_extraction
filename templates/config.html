{% extends "base.html" %}

{% block title %}配置 - 抖音视频文本提取工具{% endblock %}

{% block content %}
<div class="content-wrapper">
    <div class="card">
        <h2>⚙️ 系统配置</h2>
        <p class="subtitle">配置 API Key 和其他参数</p>
        
        <form id="configForm" class="form">
            <div class="form-group">
                <label for="DASHSCOPE_API_KEY">
                    DashScope API Key <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="DASHSCOPE_API_KEY" 
                    name="DASHSCOPE_API_KEY" 
                    placeholder="sk-..."
                    value="{{ masked_key }}"
                    required>
                <small class="form-hint">
                    阿里云 DashScope API Key，用于语音识别服务。
                    <a href="https://dashscope.console.aliyun.com/apiKey" target="_blank">获取 API Key</a>
                </small>
            </div>
            
            <div class="form-group">
                <label for="MAX_VIDEO_DURATION">最大视频时长（秒）</label>
                <input 
                    type="number" 
                    id="MAX_VIDEO_DURATION" 
                    name="MAX_VIDEO_DURATION" 
                    min="1" 
                    max="3600"
                    value="{{ config.MAX_VIDEO_DURATION }}">
                <small class="form-hint">超过此时长的视频将被拒绝处理</small>
            </div>
            
            <div class="form-group">
                <label for="ASR_MODEL">ASR 模型</label>
                <select id="ASR_MODEL" name="ASR_MODEL">
                    <option value="paraformer-v2" {% if config.ASR_MODEL == 'paraformer-v2' %}selected{% endif %}>paraformer-v2 (推荐)</option>
                    <option value="paraformer-realtime-v2" {% if config.ASR_MODEL == 'paraformer-realtime-v2' %}selected{% endif %}>paraformer-realtime-v2</option>
                    <option value="paraformer-realtime-8k-v2" {% if config.ASR_MODEL == 'paraformer-realtime-8k-v2' %}selected{% endif %}>paraformer-realtime-8k-v2</option>
                </select>
                <small class="form-hint">选择语音识别模型</small>
            </div>
            
            <div class="form-group">
                <label for="OUTPUT_DIR">输出目录</label>
                <input 
                    type="text" 
                    id="OUTPUT_DIR" 
                    name="OUTPUT_DIR" 
                    value="{{ config.OUTPUT_DIR }}">
                <small class="form-hint">文本文件的保存目录（相对路径）</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="saveBtn">
                    <span class="btn-text">保存配置</span>
                    <span class="btn-loading" style="display: none;">保存中...</span>
                </button>
                <button type="button" class="btn btn-secondary" onclick="loadConfig()">重新加载</button>
            </div>
        </form>
        
        <!-- 保存提示 -->
        <div id="saveMessage" class="message" style="display: none;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 页面加载时获取完整配置（如果需要）
async function loadConfig() {
    try {
        const response = await fetch('/api/config');
        const data = await response.json();
        
        if (data.success) {
            // 注意：API Key 已经脱敏，这里只更新其他字段
            document.getElementById('MAX_VIDEO_DURATION').value = data.config.MAX_VIDEO_DURATION;
            document.getElementById('ASR_MODEL').value = data.config.ASR_MODEL;
            document.getElementById('OUTPUT_DIR').value = data.config.OUTPUT_DIR;
            
            showMessage('配置已重新加载', 'success');
        }
    } catch (error) {
        showMessage('加载配置失败: ' + error.message, 'error');
    }
}

document.getElementById('configForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // 获取完整的 API Key（如果用户修改了）
    const apiKeyInput = document.getElementById('DASHSCOPE_API_KEY');
    let apiKey = apiKeyInput.value.trim();
    
    // 如果用户只输入了部分（可能是从 masked 值修改），需要获取完整值
    // 这里我们假设用户输入的是完整的新值
    // 如果值是 masked 的（包含...），提示用户输入完整值
    if (apiKey.includes('...') || apiKey.length < 10) {
        showMessage('请输入完整的 API Key', 'error');
        apiKeyInput.focus();
        return;
    }
    
    const configData = {
        DASHSCOPE_API_KEY: apiKey,
        MAX_VIDEO_DURATION: document.getElementById('MAX_VIDEO_DURATION').value,
        ASR_MODEL: document.getElementById('ASR_MODEL').value,
        OUTPUT_DIR: document.getElementById('OUTPUT_DIR').value,
    };
    
    // 显示加载状态
    const saveBtn = document.getElementById('saveBtn');
    const btnText = saveBtn.querySelector('.btn-text');
    const btnLoading = saveBtn.querySelector('.btn-loading');
    saveBtn.disabled = true;
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline';
    
    try {
        const response = await fetch('/api/config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(configData)
        });
        
        const data = await response.json();
        
        if (data.success) {
            showMessage('配置保存成功！', 'success');
            // 更新显示（脱敏）
            apiKeyInput.value = apiKey.substring(0, 10) + '...';
        } else {
            showMessage('保存失败: ' + (data.error || '未知错误'), 'error');
        }
    } catch (error) {
        showMessage('网络错误: ' + error.message, 'error');
    } finally {
        saveBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
    }
});

function showMessage(message, type) {
    const messageEl = document.getElementById('saveMessage');
    messageEl.textContent = message;
    messageEl.className = `message message-${type}`;
    messageEl.style.display = 'block';
    
    // 3秒后自动隐藏
    setTimeout(() => {
        messageEl.style.display = 'none';
    }, 3000);
}
</script>
{% endblock %}
